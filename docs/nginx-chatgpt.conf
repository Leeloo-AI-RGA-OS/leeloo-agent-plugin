# ── Leeloo.AI · content negotiation for /chatgpt (Codex / ChatGPT desktop) ──
# Same mechanism as nginx-claude.conf: browsers get the HTML landing, agents and
# curl get the raw Markdown steps. Reuses the two `map` directives defined in
# nginx-claude.conf ($leeloo_claude_variant, $leeloo_claude_accept_html) — those
# live at http{} level, so include this file inside the same server block.
#
# Files (copy from this repo):
#   /var/www/leeloo/chatgpt.html   ← docs/chatgpt.html
#   /var/www/leeloo/chatgpt.md     ← docs/codex-install.md

location = /chatgpt {
    default_type text/plain; charset utf-8;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options nosniff;

    if ($leeloo_claude_variant = "html") { rewrite ^ /chatgpt.html last; }
    if ($leeloo_claude_accept_html = 1)   { rewrite ^ /chatgpt.html last; }

    rewrite ^ /chatgpt.md last;
}

location = /chatgpt.html {
    internal;
    default_type text/html; charset utf-8;
}
location = /chatgpt.md {
    internal;
    default_type text/markdown; charset utf-8;
}

# Quick tests after deploy:
#   curl -s https://leeloo.ai/chatgpt                                   # → Markdown (agent view)
#   curl -s -H 'Sec-Fetch-Mode: navigate' https://leeloo.ai/chatgpt     # → HTML (browser view)
