# ── Leeloo.AI · content negotiation for /claude ──────────────────────────────
# Goal: leeloo.ai/claude serves
#   • the HTML landing page  → to real browsers (person clicks the link)
#   • the raw Markdown steps  → to agents (Claude Code WebFetch, curl, etc.)
#
# Discriminator: browsers set "Sec-Fetch-Mode: navigate" on a top-level page
# load; agent fetchers and curl do not. We fall back to the Accept header.
#
# Put claude.html and claude.md somewhere nginx can read, e.g.
#   /var/www/leeloo/claude.html
#   /var/www/leeloo/claude.md
# Adjust root/paths to your deployment.

# Map: default to markdown; switch to HTML for genuine browser navigations.
map $http_sec_fetch_mode $leeloo_claude_variant {
    default        "md";
    "navigate"     "html";
}

# Also treat an explicit "Accept: text/html" (no Sec-Fetch-Mode) as a browser,
# for older browsers / direct address-bar hits that omit the header.
map $http_accept $leeloo_claude_accept_html {
    default            0;
    "~*text/html"      1;
}

server {
    listen 443 ssl http2;
    server_name leeloo.ai www.leeloo.ai;

    # ... your existing ssl_certificate / ssl_certificate_key / other config ...

    root /var/www/leeloo;

    location = /claude {
        default_type text/plain; charset utf-8;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;

        # Browser navigation → HTML landing.
        if ($leeloo_claude_variant = "html") { rewrite ^ /claude.html last; }
        # No Sec-Fetch-Mode but Accept: text/html → still a browser.
        if ($leeloo_claude_accept_html = 1)   { rewrite ^ /claude.html last; }

        # Everything else (agents, curl, WebFetch) → raw Markdown.
        rewrite ^ /claude.md last;
    }

    location = /claude.html {
        internal;                      # only reachable via the rewrite above
        default_type text/html; charset utf-8;
    }
    location = /claude.md {
        internal;
        default_type text/markdown; charset utf-8;
    }
}

# Quick tests after deploy:
#   curl -s https://leeloo.ai/claude                         # → Markdown (agent view)
#   curl -s -H 'Sec-Fetch-Mode: navigate' https://leeloo.ai/claude   # → HTML (browser view)
#   open https://leeloo.ai/claude in a browser               # → landing page
